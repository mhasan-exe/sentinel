{% extends "layout.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="alert alert-danger shadow-sm border-0 text-center p-4">
                <i class="bi bi-x-octagon-fill fs-1 d-block mb-2"></i>
                <h5 class="mb-2">Login failed</h5>
                <p class="mb-3">That email and password don't match an account.</p>
                <a href="/login" class="btn btn-danger">
                    <i class="bi bi-arrow-repeat me-1"></i> Try again
                </a>
                <a href="/register" class="btn btn-outline-danger">Register instead</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
