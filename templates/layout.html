<html>
<head>
    <title>{{ title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
>
<style>
    ::selection {
        background-color: #610386;
        color: white;
    }
    nav {
        background-color: #7b03aa;
        padding: 1rem;
        color: white;
    }
    .font-animation {
        animation: colorChange 1s infinite alternate;
    }
    @keyframes colorChange {
        0% { font-family: Arial, sans-serif; }
        25% { font-family: Georgia }
        50% {font-family: 'Courier New', monospace; }
        75% { font-family: 'Lucida Console', monospace; }
        100% { font-family: 'Times New Roman', serif; }
    }
    .blackbg{
        background-color: black;
    }
</style>
</head>
<body>
    <nav class="navbar navbar-dark navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand text-white" href="/"><span class="font-animation">SENTINEL</span></a>
            <button class="navbar-toggler border-light" type="button" data-bs-toggle="collapse" data-bs-target="#siteNavigation" aria-controls="siteNavigation" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="siteNavigation">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link text-light" href="/chat">Chat</a>
                    {% if user_id %}
                        <a class="nav-link text-white" href="/users">Users</a>
                        <a class="nav-link text-white" href="/logout">Logout</a>
                    {% else %}
                        <a class="nav-link text-white" href="/login">Login</a>
                        <a class="nav-link text-white" href="/register">Register</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
    </div>
    {% block content %}
    {% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
</body>
</html>
