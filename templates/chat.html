{% extends "layout.html" %}

{% block content %}

<style>
@keyframes latencyPulse {
    0%   { transform: scale(1);    box-shadow: 0 0 0 0 rgba(13,110,253,0.5); }
    50%  { transform: scale(1.08); box-shadow: 0 0 0 6px rgba(13,110,253,0); }
    100% { transform: scale(1);    box-shadow: 0 0 0 0 rgba(13,110,253,0); }
}
.latency-badge-pulse {
    animation: latencyPulse 0.5s ease-out;
}
</style>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-9 col-lg-8">

            <div class="card shadow-sm border-0">

                <div class="card-header bg-primary text-white py-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-0">
                                <i class="bi bi-chat-dots-fill me-2"></i>
                                Sentinel Chat
                            </h5>
                            <small class="opacity-75">
                                Secure communication channel
                            </small>
                        </div>

                        <span id="connectionStatus"
                            class="badge bg-warning text-dark">
                            Connecting...
                        </span>
                    </div>

                    <div id="latencyBadges" class="mt-2 d-flex gap-2 flex-wrap">
                        <!-- Populated live as real round-trip times come back per medium -->
                    </div>
                </div>

                <div class="card-body bg-light">

                    <div class="mb-3">
                        <label for="recipient" class="form-label fw-semibold">
                            Recipient
                        </label>

                        <select id="recipient" class="form-select">
                            <option value="1">User 1</option>
                            <option value="2">User 2</option>
                            <option value="3">User 3</option>
                        </select>
                    </div>

                    <div id="messages"
                        class="bg-white border rounded-3 p-3 overflow-auto"
                        style="height: 450px;">
                    </div>

                </div>

                <div class="card-footer bg-white p-3">

                    <div class="input-group">

                        <input
                            id="messageInput"
                            type="text"
                            class="form-control"
                            placeholder="Type your message..."
                            autocomplete="off"
                        >

                        <button
                            id="sendButton"
                            class="btn btn-primary"
                            type="button"
                            onclick="sendMessage()"
                        >
                            <i class="bi bi-send-fill me-1"></i>
                            Send
                        </button>

                    </div>

                    <div class="text-muted small mt-2">
                        Press Enter to send
                    </div>

                </div>

            </div>

        </div>
    </div>
</div>


<script>

const socketProtocol =
    window.location.protocol === "https:" ? "wss:" : "ws:";

const socket =
    new WebSocket(`${socketProtocol}//${window.location.host}/ws`);

const messagesContainer =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const connectionStatus =
    document.getElementById("connectionStatus");

const latencyBadges =
    document.getElementById("latencyBadges");


// REAL client-measured round trips, keyed by medium (security_mode the
// server actually used for that message). No fabricated numbers here —
// pendingSends tracks exactly when THIS browser sent each message, and
// the round trip is only recorded once the server's own echo of that
// same client_msg_id comes back.
const pendingSends = {};       // client_msg_id -> performance.now() at send time
const latencyByMedium = {};    // medium -> { count, totalMs, lastMs }

function makeClientMsgId() {
    return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function recordLatency(medium, rttMs) {
    if (!latencyByMedium[medium]) {
        latencyByMedium[medium] = { count: 0, totalMs: 0, lastMs: 0 };
    }
    const stats = latencyByMedium[medium];
    stats.count += 1;
    stats.totalMs += rttMs;
    stats.lastMs = rttMs;

    renderLatencyBadges();

    if (socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({
            type: "latency_report",
            security_mode: medium,
            rtt_ms: rttMs
        }));
    }
}

function renderLatencyBadges() {
    latencyBadges.innerHTML = "";

    for (const [medium, stats] of Object.entries(latencyByMedium)) {
        const avg = (stats.totalMs / stats.count).toFixed(2);

        const badge = document.createElement("span");
        badge.className = "badge bg-secondary latency-badge-pulse";
        badge.textContent =
            `${medium}: ${stats.lastMs.toFixed(2)}ms (avg ${avg}ms, n=${stats.count})`;

        latencyBadges.appendChild(badge);
    }
}


socket.onopen = function () {

    connectionStatus.textContent = "Connected";
    connectionStatus.className = "badge bg-success";

};

socket.onclose = function () {

    connectionStatus.textContent = "Disconnected";
    connectionStatus.className = "badge bg-danger";

};


socket.onerror = function () {

    connectionStatus.textContent = "Connection Error";
    connectionStatus.className = "badge bg-danger";

};


socket.onmessage = function (event) {

    const data = JSON.parse(event.data);

    const isMe =
        String(data.userId) === String("{{ user_id }}");

    // REAL round trip: this only fires once the SERVER echoes back the
    // exact client_msg_id this browser generated when it sent — i.e.
    // the message has genuinely gone client -> server -> (encrypt/sign
    // if that medium is on) -> broadcast -> back to this client.
    if (isMe && data.client_msg_id && pendingSends[data.client_msg_id] !== undefined) {
        const rtt = performance.now() - pendingSends[data.client_msg_id];
        delete pendingSends[data.client_msg_id];
        recordLatency(data.security_mode || "UNKNOWN", rtt);
    }

    const messageRow =
        document.createElement("div");

    messageRow.className =
        "d-flex mb-3 " +
        (isMe
            ? "justify-content-end"
            : "justify-content-start");


    const wrapper =
        document.createElement("div");

    wrapper.style.maxWidth = "75%";


    const bubble =
        document.createElement("div");

    bubble.className =
        isMe
            ? "p-3 bg-primary text-white rounded-3 shadow-sm"
            : "p-3 bg-white text-dark border rounded-3 shadow-sm";


    /*
        IMPORTANT:
        textContent prevents received messages
        from being interpreted as HTML.
    */

    bubble.textContent = data.text;


    const metadata =
        document.createElement("small");

    metadata.className =
        "text-muted d-block mt-1";


    metadata.textContent =
        `${data.time} · ` +
        (isMe
            ? "You"
            : `User ${data.userId}`);


    wrapper.appendChild(bubble);
    wrapper.appendChild(metadata);

    messageRow.appendChild(wrapper);

    messagesContainer.appendChild(messageRow);

    messagesContainer.scrollTop =
        messagesContainer.scrollHeight;

};


function sendMessage() {

    const text =
        messageInput.value.trim();

    const recipient =
        document.getElementById("recipient").value;


    if (!text) {
        return;
    }


    if (socket.readyState !== WebSocket.OPEN) {

        alert("WebSocket is not connected.");

        return;
    }


    socket.send(JSON.stringify({

        recipient_id: Number(recipient),

        text: text,

        client_msg_id: (function () {
            const id = makeClientMsgId();
            pendingSends[id] = performance.now();
            return id;
        })()

    }));


    messageInput.value = "";

    messageInput.focus();

}


messageInput.addEventListener(
    "keydown",
    function (event) {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();

        }

    }
);

</script>

{% endblock %}
