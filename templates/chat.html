{% extends "layout.html" %}

{% block content %}
<style>
    .chat-shell { height: calc(100vh - 150px); height: calc(100dvh - 150px); min-height: 520px; }
    .chat-shell > .row { height: 100%; min-height: 0; }
    .chat-shell > .row > * { min-height: 0; }
    .chat-sidebar { border-right: 1px solid #dee2e6; overflow-y: auto; }
    .chat-user { cursor: pointer; }
    .chat-user.active { background: #BF00FF; }
    .chat-user.active .chat-unread { display: none; }
    .chat-avatar { width: 42px; height: 42px; }
    .chat-window { position: relative; height: 100%; background: #efeae2; min-height: 0; }
    .chat-messages { flex: 1 1 0; min-height: 0; overflow-y: scroll; overscroll-behavior: contain; }
    .message-bubble { max-width: 75%; white-space: pre-wrap; overflow-wrap: anywhere; }
    .message-in { background: #fff; }
    .message-out { background: #d9fdd3; margin-left: auto; }
    .chat-empty { color: #6c757d; }
    #sessionRecovery[hidden] { display: none !important; }
    #messageForm { z-index: 2; flex: 0 0 auto; }
    #messageForm[hidden] { display: none !important; }
    #messageInput { min-width: 0; }

    @media (max-width: 767.98px) {
        .chat-shell { height: calc(100vh - 112px); height: calc(100dvh - 112px); min-height: 0; }
        .chat-shell > .row { height: 100% !important; flex-flow: column nowrap; }
        .chat-sidebar { flex: 0 0 178px; width: 100%; max-height: 178px; border-right: 0; border-bottom: 1px solid #dee2e6; }
        .chat-window { flex: 1 1 0; width: 100%; min-height: 0; }
        .chat-window #chatHeader { flex: 0 0 auto; }
        .chat-window #messageForm:not([hidden]) { display: flex; }
        .chat-window #sessionRecovery { flex-shrink: 0; gap: .5rem; }
        .chat-window #sessionRecovery .btn { white-space: nowrap; }
    }
</style>

<div class="container-fluid px-0">
    <div class="card shadow-sm chat-shell overflow-hidden">
        <div class="row g-0 h-100">
            <aside class="col-md-4 col-lg-3 chat-sidebar bg-white">
                <div class="p-3 border-bottom">
                    <div class="d-flex align-items-center justify-content-between">
                        <h1 class="h5 mb-0">Chats</h1>
                        <span id="socketStatus" class="badge text-bg-secondary">Connecting</span>
                    </div>
                    <div class="small text-muted mt-1">Signed in as user {{ user_id }}</div>
                    <div id="liveSecurityMode" class="small text-muted mt-1">Security: loading...</div>
                </div>
                <div id="userList" class="list-group list-group-flush">
                    <div class="p-3 text-muted">Loading users...</div>
                </div>
            </aside>

            <section class="col-md-8 col-lg-9 d-flex flex-column chat-window">
                <div id="sessionRecovery" hidden class="alert alert-warning rounded-0 mb-0 d-flex justify-content-between align-items-center" role="alert">
                    <span id="sessionRecoveryMessage">Your login session is expired or corrupt.</span>
                    <a class="btn btn-sm btn-warning" href="/login">Log in again</a>
                </div>
                <header id="chatHeader" class="bg-white border-bottom p-3">
                    <div class="chat-empty">Select a user to open a chat</div>
                </header>
                <div id="messages" class="chat-messages flex-grow-1 p-3 d-flex flex-column gap-2">
                    <div class="chat-empty text-center m-auto">Your conversations will appear here.</div>
                </div>
                <form id="messageForm" class="bg-white border-top p-3 d-flex gap-2" hidden>
                    <input id="messageInput" class="form-control" autocomplete="off" placeholder="Type a message...">
                    <button class="btn btn-primary" type="submit" aria-label="Send message">
                        <i class="bi bi-send-fill"></i>
                    </button>
                </form>
            </section>
        </div>
    </div>
</div>

<script>
const currentUserId = {{ user_id }};
const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
let socket = null;
let reconnectDelay = 1000;
const userList = document.getElementById("userList");
const messages = document.getElementById("messages");
const chatHeader = document.getElementById("chatHeader");
const messageForm = document.getElementById("messageForm");
const messageInput = document.getElementById("messageInput");
const socketStatus = document.getElementById("socketStatus");
const sessionRecovery = document.getElementById("sessionRecovery");
const sessionRecoveryMessage = document.getElementById("sessionRecoveryMessage");
const liveSecurityMode = document.getElementById("liveSecurityMode");
let selectedUser = null;
let sessionValid = true;
let renderedMessageKeys = new Set();
const unreadCounts = new Map();
const userItems = new Map();
const latestMessageTimes = new Map();

function showSessionRecovery(message) {
    sessionValid = false;
    sessionRecoveryMessage.textContent = message;
    sessionRecovery.hidden = false;
    messageForm.hidden = true;
    messageInput.disabled = true;
}

async function checkSession() {
    try {
        const response = await fetch("/api/session-status", { credentials: "same-origin" });
        if (!response.ok) {
            showSessionRecovery("Your login session is expired or invalid. Please log in again.");
            if (socket.readyState === WebSocket.OPEN) socket.close(4001, "session invalid");
            return false;
        }
        const status = await response.json();
        if (Number(status.user_id) !== currentUserId) {
            showSessionRecovery("Your login session changed. Please log in again.");
            if (socket.readyState === WebSocket.OPEN) socket.close(4001, "session changed");
            return false;
        }
        return true;
    } catch (error) {
        return sessionValid;
    }
}

function renderLiveSecurity(config) {
    const modes = [];
    if (config.encryption) modes.push("Encryption");
    if (config.tls) modes.push("TLS");
    if (config.ml_kem) modes.push("ML-KEM");
    if (config.ml_dsa) modes.push("ML-DSA");
    liveSecurityMode.textContent = `Security: ${modes.length ? modes.join(" + ") : "Plaintext"}`;
}

function formatTime(value) {
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? "" : date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function renderMessage(message, allowUnsafe = false) {
    const messageKey = message.message_id || message.client_msg_id || `${message.userId}:${message.recipient_id}:${message.time}:${message.text}`;
    if (renderedMessageKeys.has(messageKey)) return;
    renderedMessageKeys.add(messageKey);
    const outgoing = Number(message.userId) === currentUserId;
    const conversationUserId = outgoing ? Number(message.recipient_id) : Number(message.userId);
    latestMessageTimes.set(conversationUserId, message.time);
    const row = document.createElement("div");
    row.className = `message-bubble rounded-3 px-3 py-2 ${outgoing ? "message-out" : "message-in"}`;

    const text = document.createElement("div");
    if (allowUnsafe && message.execution === "real") {
        text.innerHTML = message.text;
    } else {
        text.textContent = message.text;
    }
    row.appendChild(text);

    const meta = document.createElement("div");
    meta.className = "small text-muted text-end mt-1";
    meta.textContent = `${formatTime(message.time)}${message.security_mode ? ` · ${message.security_mode}` : ""}`;
    row.appendChild(meta);
    messages.appendChild(row);
    scrollMessagesToBottom();
}

function renderInterceptStatus(message) {
    const row = document.createElement("div");
    row.className = "message-bubble message-in border border-warning px-3 py-2";
    const text = document.createElement("div");
    text.textContent = message.message;
    const meta = document.createElement("div");
    meta.className = "small text-muted text-end mt-1";
    meta.textContent = `Hacker View · ${message.status}`;
    row.append(text, meta);
    messages.appendChild(row);
    scrollMessagesToBottom();
}

function scrollMessagesToBottom() {
    requestAnimationFrame(() => {
        messages.scrollTop = messages.scrollHeight;
    });
}

function showMessages(history) {
    messages.replaceChildren();
    renderedMessageKeys = new Set();
    if (!history.length) {
        const empty = document.createElement("div");
        empty.className = "chat-empty text-center m-auto";
        empty.textContent = "No messages yet. Say hello.";
        messages.appendChild(empty);
        return;
    }
    history.forEach(renderMessage);
    scrollMessagesToBottom();
}

function updateUnreadBadge(userId) {
    const item = userItems.get(Number(userId));
    if (!item) return;
    const badge = item.querySelector(".chat-unread");
    const count = unreadCounts.get(Number(userId)) || 0;
    badge.textContent = count > 99 ? "99+" : String(count);
    badge.hidden = count === 0;
    sortUserList();
}

function sortUserList() {
    const items = Array.from(userItems.entries())
        .sort(([firstId], [secondId]) => {
            const unreadDifference = (unreadCounts.get(Number(secondId)) || 0)
                - (unreadCounts.get(Number(firstId)) || 0);
            if (unreadDifference) return unreadDifference;
            const firstTime = Date.parse(latestMessageTimes.get(Number(firstId)) || "") || 0;
            const secondTime = Date.parse(latestMessageTimes.get(Number(secondId)) || "") || 0;
            return secondTime - firstTime;
        })
        .map(([, item]) => item);
    items.forEach(item => userList.appendChild(item));
}

function markConversationRead(userId) {
    unreadCounts.set(Number(userId), 0);
    updateUnreadBadge(userId);
}

function markConversationUnread(userId) {
    const numericUserId = Number(userId);
    unreadCounts.set(numericUserId, (unreadCounts.get(numericUserId) || 0) + 1);
    updateUnreadBadge(numericUserId);
}

async function openChat(user, element) {
    if (!sessionValid || !(await checkSession())) return;
    selectedUser = user;
    markConversationRead(user.id);
    document.querySelectorAll(".chat-user").forEach(item => item.classList.remove("active"));
    element.classList.add("active");
    chatHeader.innerHTML = `<strong></strong><div class="small text-muted">Private conversation</div>`;
    chatHeader.querySelector("strong").textContent = user.name;
    messageForm.hidden = false;
    messages.replaceChildren();
    const loading = document.createElement("div");
    loading.className = "chat-empty text-center m-auto";
    loading.textContent = "Loading messages...";
    messages.appendChild(loading);

    const response = await fetch(`/api/messages/${user.id}`);
    if (!response.ok) {
        loading.textContent = "Unable to load this conversation.";
        return;
    }
    showMessages(await response.json());
    scrollMessagesToBottom();
    messageInput.focus();
}

async function syncSelectedChat() {
    if (!selectedUser || !sessionValid) return;
    try {
        const response = await fetch(`/api/messages/${selectedUser.id}`, { credentials: "same-origin" });
        if (!response.ok) return;
        const history = await response.json();
        history.forEach(renderMessage);
        scrollMessagesToBottom();
    } catch (error) {
        // The WebSocket remains the primary live path; polling recovers missed frames.
    }
}

async function loadUsers() {
    const response = await fetch("/api/chat-users");
    if (!response.ok) {
        userList.innerHTML = '<div class="p-3 text-danger">Unable to load users.</div>';
        return;
    }
    const users = await response.json();
    userList.replaceChildren();
    if (!users.length) {
        userList.innerHTML = '<div class="p-3 text-muted">No other users registered.</div>';
        return;
    }
    users.forEach(user => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "chat-user list-group-item list-group-item-action d-flex align-items-center gap-3 p-3";
        item.innerHTML = '<span class="chat-avatar rounded-circle bg-primary-subtle text-primary d-flex align-items-center justify-content-center"><i class="bi bi-person-fill"></i></span><span class="fw-semibold flex-grow-1"></span><span class="chat-unread badge rounded-pill text-bg-danger" hidden>0</span>';
        item.querySelector(".fw-semibold").textContent = user.name;
        userItems.set(Number(user.id), item);
        item.addEventListener("click", () => openChat(user, item));
        userList.appendChild(item);
    });
}

function handleSocketMessage(event) {
    const message = JSON.parse(event.data);
    if (message.type === "security_config") {
        renderLiveSecurity(message.config);
        return;
    }
    if (message.type === "session_key_corrupt") {
        sessionRecovery.querySelector("a").href = message.login_url || "/login";
        showSessionRecovery(message.message);
        return;
    }
    if (message.type === "message_intercept_status") {
        renderInterceptStatus(message);
        return;
    }
    if (message.type === "xss_demo") {
        renderMessage(message, true);
        return;
    }
    if (!message.userId || !message.recipient_id) return;
    const messageUserId = Number(message.userId);
    const recipientId = Number(message.recipient_id);
    const conversationUserId = messageUserId === currentUserId ? recipientId : messageUserId;
    const belongsToChat = selectedUser && conversationUserId === Number(selectedUser.id);
    if (belongsToChat) {
        const empty = messages.querySelector(".chat-empty");
        if (empty) messages.replaceChildren();
        renderMessage(message, true);
    } else if (messageUserId !== currentUserId && recipientId === currentUserId) {
        markConversationUnread(messageUserId);
    }
}

function connectSocket() {
    socket = new WebSocket(`${protocol}//${window.location.host}/ws`);
    socket.addEventListener("open", () => {
        reconnectDelay = 1000;
        socketStatus.textContent = "Live";
        socketStatus.className = "badge text-bg-success";
        syncSelectedChat();
    });
    socket.addEventListener("message", handleSocketMessage);
    socket.addEventListener("close", event => {
        socketStatus.textContent = "Reconnecting...";
        socketStatus.className = "badge text-bg-warning text-dark";
        if (event.code === 1008 || event.code === 4001) {
            showSessionRecovery("Your login session is expired or unavailable. Please log in again.");
            return;
        }
        setTimeout(connectSocket, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 2, 10000);
    });
}

connectSocket();

messageForm.addEventListener("submit", async event => {
    event.preventDefault();
    const text = messageInput.value.trim();
    if (!text || !selectedUser || !sessionValid || socket.readyState !== WebSocket.OPEN) return;
    if (!(await checkSession())) return;
    socket.send(JSON.stringify({ recipient_id: selectedUser.id, text, client_msg_id: crypto.randomUUID() }));
    messageInput.value = "";
});

loadUsers();
setInterval(syncSelectedChat, 2000);
setInterval(checkSession, 2000);
</script>
{% endblock %}
