{%- extends "layout.html" -%}
{% block content %}
    {% for user in users %}
    <div class="container">
            <div class="user-card">
                <p>User: <strong>{{ user.name }}</strong> | Email: <strong>{{ user.email }}</strong> | ID: <strong>{{ user.id }}</strong></p>
            </div>
        </div>
    {% endfor %}
{% endblock %}
